#
# 当前所选版本为 OptE
# DNS次级完美(特别推荐): 小众国内外域名、TCP/UDP、国内和国外都能兼顾，匹配域名规则列表中的DNS都不会有问题
# DNS配置了配置了: respect-rules/default-nameserver/nameserver/proxy-server-nameserver/direct-nameserver/fallback等
# rules务必配置: rule-set,cn_domain,DIRECT/rule-set,cn_ip,DIRECT，本地ip务必加no-resolve避免DNS泄露
# 需保障nameserver配置的国外DNS服务器解析正常
# DNS检测结果: ip.skk.moe/dns-exit-lookup有CN ？？, ipleak.net、browserleaks.com/dns、dnsleaktest.org/dns-leak-test都没有CN
#
# =============================== WEB UI管理面板配置 start ===============================
# > WEB UI管理面板，有Metacubexd、Zashboard等多个面板可选，更换对应的ui-url即可
# > 配置 WEB UI 目录，使用 http://{{external-controller}}/ui 访问
external-controller: 0.0.0.0:9999            # 外部访问/控制面板端口
secret: "caic001"                            # 访问密钥
# external-ui: /path/to/ui/folder/           # WEB UI面板的文件存放目录
# external-ui-name: zashboard
# external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"   # 目前支持下载zip,tgz格式的压缩包
#
external-controller-cors:                    # 跨域设置（CORS）
  allow-origins:
    - '*'                                    # 允许所有网页来源发起请求
#    - 'http://192.168.2.210:36080'          # 仅允许此 Zashboard 面板跨域访问（结尾不要加斜杠 /）
  allow-private-network: true                # 允许私有网络访问
# =============================== WEB UI管理面板配置 end ===============================
#
#
# =============================== GEO数据库配置 start ===============================
# > 该配置用于加载地理位置信息数据库，包括 IP 和域名的地理位置数据
# > 在不同的规则配置中，可以使用地理信息进行更精确的流量路由
geodata-mode: false               # 使用geoip.dat数据库(默认: false使用mmdb数据库)
geodata-loader: memconservative   # 表示使用标准方式加载geodata数据，有快速加载、标准加载、延迟加载供选择；memconservative适用于较低内存加载
geo-auto-update: true             # 是否自动更新 geodata
geo-update-interval: 24           # 更新间隔为 24 小时
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/Country.mmdb"
  asn: "https://cdn.jsdelivr.net/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
# =============================== GEO数据库配置 end ===============================
#
#
# =============================== 全局基础配置 start ===============================
port: 7890                      # HTTP 代理端口，默认 7890
socks-port: 7891                # SOCKS5 代理端口，默认 7891
redir-port: 7892                # 透明代理端口，用于 Linux 和 MacOS
mixed-port: 7893                # HTTP(S) 和 SOCKS 代理混合端口
allow-lan: true                 # 是否允许局域网设备连接
bind-address: "*"               # 绑定所有 IP 地址，默认会绑定到 127.0.0.1（本地回环地址），而 * 表示允许从任何网络接口连接
bypass-lan: false              # true表示目标ip流量走手机WIFI或蜂窝卡出去不进mihomo
ipv6: false                     # 内核是否接受ipv6的数据进来
mode: rule                      # 使用规则模式分流
log-level: warning              # 日志输出级别: info / warning / error / debug / silent
tcp-concurrent: true            # 启用 TCP 并发连接，将会使用 dns 解析出的所有 IP 地址进行连接，使用第一个成功的连接
unified-delay: true             # 开启统一延迟时，会计算 RTT，以消除连接握手等带来的不同类型节点的延迟差
find-process-mode: off          # 进程匹配模式，always-开启:强制匹配所有进程；strict-默认:由Clash判断是否开启；
#                               # off-不匹配进程:路由器用不上，选off.
# authentication:               # 通过HTTP/SOCKS5连接时的账号密码，可设置多个账号密码，每行一个
#   - name:password
keep-alive-idle: 600
keep-alive-interval: 15
profile:                        # 缓存设置(文件位置./cache.db)
  store-selected: true          # 节点状态记忆（若不同配置有同代理名称,设置值共享）
  store-fake-ip: true           # fake-ip缓存
experimental:                   # 实验性功能
  ignore-resolve-fail: true     # 忽略解析失败,当核心需解析某个域名（尤其是节点服务器的域名、做健康检查时）却查不到结果，默认会把这个连接/节点判为失败,
                                # 设为 true 后：遇到解析失败不当作致命错误，继续尝试、不因此把节点标红。好处是避免因DNS临时抽风就把可用节点误判为不可用。
  # interface-name: eth0        # 出站流量绑定到指定网卡,一般默认出口网卡就是 eth0(如果不是就改成对应的网卡名称),windows/macos不支持
# =============================== 全局基础配置 end ===============================
#
#
# =============================== DNS 配置 start ===============================
# > DNS 解析配置，决定了域名解析方式和缓存策略
# > DNS各项设置官方说明 https://merlinkodo.github.io/Clash-Rev-Doc/config/dns/#nameserver-policy
dns:
  enable: true                          # 启用 DNS 功能
  listen: 0.0.0.0:1053                  # 开启 DNS 服务器监听
  # prefer-h3: false                    # 如果DNS服务器支持DoH3会优先使用h3，提升性能；不能与respect-rules同时启用
  use-hosts: true                       # 查找 hosts 并返回IP记录,默认 true
  cache-algorithm: arc                  # 使用性能更优的 ARC 缓存算法
  ipv6: false                           # IP6解析开关；如果为false，将返回ip6结果为空
#
# > 启用 Fake-IP 模式，这是强制劫持所有 DNS 请求的关键
  enhanced-mode: fake-ip                # 模式切换 redir-host/fake-ip，这里设置增强模式为fake-ip模式，提高解析速度和连接性能
  fake-ip-range: 28.0.0.0/8             # fake-ip 池设置，可自定义fake-ip网段池
  fake-ip-range6: fc00::/16
# > Fake-IP 过滤器: 确保国内域名不使用 Fake-IP 而使用真实IP，国外域名使用 Fake-IP
  fake-ip-filter-mode: blacklist        # 默认blacklist，匹配成功不返回fake-ip；可改为whitelist，即只有匹配成功才返回fake-ip
  fake-ip-filter:                       # 配置不使用fake-ip的域名列表(也就是返回真实i，相当于使用redir-host模式)
    # - "*"                             # 全部返回真实ip,相当于所有的转为redir-host模式
    - "+.lan"
    - "+.local"
    - "+.internal"
    - rule-set:fakeipfilter_domain      # 主要是一些国内域名，使用fake-ip会打不开或无法连接
    - rule-set:private_domain           # 主要是一些私有域名，使用fake-ip会打不开或无法连接
    - rule-set:fakeipfilter_!cn         # 主要是一些stun/NTP等服务器（这些服务器很多是国外的），使用fake-ip会打不开或无法连接

    - GEOSITE,CN                        # 国内域名不使用fake-ip
    - GEOSITE,microsoft@cn              # 国内微软域名不使用fake-ip
    - GEOSITE,onedrive                  # 国内onedrive域名不使用fake-ip
    - GEOSITE,apple-cn                  # 国内苹果域名不使用fake-ip
    - GEOSITE,icloud@cn                 # 国内icloud域名不使用fake-ip
    - GEOSITE,steam@cn                  # 国内steam域名不使用fake-ip
    - GEOSITE,category-games@cn         # 国内游戏域名不使用fake-ip
#
# > respect-rules参数说明:  
# >> 决定了后面的nameserver、fallback和nameserver-policy向dns服务器的连接过程是否遵守遵守rules规则
# >> 如果为false（默认值）则这三部分的dns服务器在未特别指定的情况下会直连
# >> 如果为true，将会按照rules的规则匹配链接方式(走代理或直连)向dns服务器进行连接，如果有特别指定则任然以指定值为准
#    等效于当respect-rules为false时给dns服务器明确了走直连或代理（看对应的rules走哪个）: 
#    等效示例: https://doh.opendns.com/dns-quer#Proxy 或 https://dns.alidns.com/dns-query#direct
# >> 需先配置了proxy-server-nameserver才能启用 respect-rules: true
# >> 如果配置了proxy-server-nameserver，则前面的设置prefer-h3不能同时使用，只能二选一
# >> 如果nameserver、fallback和nameserver-policy这三个dns服务器出现域名必须配置default-nameserver进行解析
  respect-rules: true      # 如果为true，则proxy-server-nameserver必须设置保留；如果为false(默认)则nameserver/fallback/nameserver-policy在未特别指定时会直连
#
# > DNS服务器配置和参数说明: 
# >> ShellCrash中建议开启default-nameserver(即使其他DNS服务器是IP格式)——可以减少一些未知的问题
# >> DNS服务器省流设置就是direct-nameserver用国内的、且最好是ISP服务商的DNS服务器，而nameserver用海外的DNS服务器
# >> 默认先使用nameserver解析出真实IP进行IP分流判断（这个真实IP可能是CDN的IP，不是最优的IP），如果是国内IP需再走direct-nameserver二次解析最优的
#    真实IP(舍弃前面nameserver解析到的真实IP/可能是CDN的)；如是国外IP会走兜底节点所在服务器解析出站-本地依然是fake-ip
# >> 启用direct-nameserver的设置解释参考链接: https://github.com/MetaCubeX/mihomo/discussions/1567
# >> fallback主要是针对UDP流量——UDP要求本地获取真实IP不能使用Fake-IP,主要用于解析一些小众域名或不常用的国外域名，防止出现UDP流量DNS泄露
  default-nameserver:                   # 用于解析nameserver/fallback 以及其他 DNS 服务器配置的DNS服务域名, 只能使用纯IP格式，可使用加密 DNS
    - https://223.5.5.5/dns-query       # AliDNS
    - https://119.29.29.29/dns-query    # TencentDNS
  direct-nameserver:                    # 规则匹配到直连时使用的DNS，用国内DNS
    - https://223.5.5.5/dns-query#disable-qtype-64=true&disable-qtype-65=true       # AliDNS
    - https://119.29.29.29/dns-query#disable-qtype-64=true&disable-qtype-65=true    # TencentDNS
  proxy-server-nameserver:              # 代理节点域名解析服务器，仅用于解析代理节点的域名，如果不填则遵循nameserver-policy、nameserver和fallback的配置
    - https://223.5.5.5/dns-query#disable-qtype-64=true&disable-qtype-65=true       # AliDNS
    - https://119.29.29.29/dns-query#disable-qtype-64=true&disable-qtype-65=true    # TencentDNS
  nameserver:                           # 默认的域名解析服务器，如不配置fallback/proxy-server-nameserver, 则所有域名都由这里的nameserver解析
    - https://dns.cloudflare.com/dns-query#ecs=223.5.5.0/24&ecs-override=true&disable-qtype-64=true&disable-qtype-65=true      # CloudflareDNS#ecs通用DNS
    - https://dns.google/dns-query#ecs=223.5.5.0/24&ecs-override=true&disable-qtype-64=true&disable-qtype-65=true              # GoogleDNS#ecs通用DNS
    # > DNS后的重要参数说明: 
    # >> ecs=1.0.0.0/24或ecs=223.5.5.0/24 表示指定ECS(EDNS客户端子网): 即在发送DNS查询时，它们向DNS服务器(比如这里的Cloudflare DNS/Googel DNS/OpenDNS)声明了
    #    完全不同的地理位置和身份隐私,带ECS优先返回离ECS指定子网距离最近或优化的服务器IP，不带ECS返回的是离代理节点最近的服务器IP;
    # >> ecs-override=true 表示防真实IP泄露: 强制将客户端子网覆盖（ecs-override=true）指定为 比如这里的Cloudflare网段1.0.0./24/阿里的网段223.5.5.0/24，以隐藏
    #    你真实的物理公网IP，不配置该项表示建议（内核可能将你真实的国内宽带公网IP传给DNS），配置了表示强制（强行抹除你的真实宽带公网IP，对外坚称属于指定的ecs网段）;
    # >> disable-qtype-65=true 是提升代理兼容性: 彻底禁用 HTTPS 记录查询（disable-qtype-65=true），防止浏览器因为尝试 ECH（加密客户端问候）
    #    等高级特性而导致网页卡顿、连接被重置（Reset）或绕过分流直连.
  fallback:
    - https://dns.cloudflare.com/dns-query#disable-qtype-64=true&disable-qtype-65=true
    - https://dns.google/dns-query#disable-qtype-64=true&disable-qtype-65=true
  fallback-filter:      # 备用DNS服务器的过滤规则，决定哪些DNS查询可以使用备用 DNS，非必要
    geoip: true         # 不匹配为geoip规则(如下是cn)的使用fallback返回结果——也就是cn时使用nameservers解析的IP地址结果
    geoip-code: cn      # geoip匹配区域设定
# =============================== DNS 配置 end ===============================
#
#
# =============================== TUN配置 start ===============================
# > 配置 TUN 模式，适用于透明代理和高效流量转发,裸核跑才用的上
tun:
  enable: true                                # 是否启用 tun 模式来路由全局流量
  stack: mixed                                # tun 模式堆栈,可用值system/gvisor/mixed/lwip,如无使用问题,建议使用 system 栈;MacOS 用户推荐 gvisor栈
  dns-hijack: ["any:53", "tcp://any:53"]      # dns劫持,一般设置为 any:53 即可, 即劫持所有 53 端口的 udp 流量
  mtu: 1492                                   # 减少 MTU 问题，如网页无法打开、测速慢
  gso: true                                   # 启用通用分段卸载（提升性能）
  gso-max-size: 65536
  udp-timeout: 300                            # UDP 会话保持时间
  #
  # device: nikki                 # 仅支持OpenWrt上使用Nikki时，混入全部不修改的情况，开启tun网卡接口指定为nikki
  # device: utun                  # 指定入口,它是专门用来拦截/接收系统流量的入口,相当于告诉 mihomo 你的虚拟网卡名字叫 utun.
  # > 使用仅内核运行时，修改下面三项auto-route/auto-redirect/auto-detect-interface为true————通常情况下不用修改
  # auto-route: true              # 允许内核全权下发和修改系统路由表,自动将全局流量路由进入tun网卡，false表示顺应shellcrash脚本
  # auto-redirect: true           # 允许内核全权操作防火墙(通过内置的nftables/iptables),false表示顺应shellcrash脚本仅支持linux,依赖nftables内核模块;
  #                               # auto-route、auto-redirect与routing-mark相冲突,shellcrash默认强制开启了routing-mark,所以只能设置为false
  # auto-detect-interface: true   # 让Clash内核锁定出口,true表示自动检测物理网卡作为流量出口,且防止流量回环，多出口网卡同时连接的设备建议手动指定出口物理网卡
  # route-exclude-address-set:    # 仅支持linux,前提需auto-route为ture，依赖nftables模块,如果是cn_ip会绕过mihomo内核直接访问，性能最高但看不到连接状态；
  #   - cn_ip                     # 如果删除该设置项，cn_ip的流量将进入mihomo内核走rules的规则RULE-SET,cn_ip,直连，且可看到连接状态;
  #                               # 务必注意最后的rule-providers中需定义cn_ip集，这里不支持GEOIP,CN数据集。
  # routing-mark: 7894            # 强制要求内核在自动路由和防火墙行为中，必须使用 ShellCrash 指定的 7894 标签【核心兼容项:对齐ShellCrash】
# =============================== TUN配置 end ===============================
#
#
# =============================== 流量嗅探Sniffer配置 start ===============================
# > 启用流量嗅探功能，用于监控和分析网络流量
# > 嗅探（fakeip下可以不用嗅探——开启CN使用真实IP时）
sniffer:
  enable: true                       # 嗅探开关
  force-dns-mapping: false           # 这里设置为false，表示关闭已知域名的重复嗅探
  sniff:                             # 嗅探协议对象: 目前支持tls/http
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:                       # 需要跳过嗅探的域名
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.baidu.com"
    - "+.bilibili.com"
  # force-domain:                    # 需要强制嗅探的域名，默认只对IP嗅探
  # # - '+'                          # 去掉注释后等于全局嗅探
  #   - 'google.com'
  # port-whitelist:                  # 端口白名单，只对名单内的端口进行域名嗅探
  #  - 80
  #  - 443
  #  - 8000-9000
# =============================== 流量嗅探Sniffer配置 end ===============================
#
#
