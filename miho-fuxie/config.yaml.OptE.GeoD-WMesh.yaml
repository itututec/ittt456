  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, 👌 手选节点, 🎯 落地节点, ➕ 自建节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇸🇬 狮城节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🧩 其他节点, 🔯 自建故转, 🔯 香港故转, 🔯 台湾故转, 🔯 狮城故转, 🔯 日本故转, 🔯 美国故转, 🔁 香港自动, 🔁 台湾自动, 🔁 狮城自动, 🔁 日本自动,🔁 美国自动, DIRECT]}
# =============================== 策略组配置 end ===============================
#
#
# =============================== 分流规则 start ===============================
rules:
  # > 海外QUIC阻断——海外域名&443端口&UDP协议流量AND合集
  - AND,((RULE-SET,cn!_domain),(DST-PORT,443),(NETWORK,UDP)),REJECT
  #
  # > 防 WebRTC 泄漏（拦截 STUN）——如设置后经常出现问题，可注释掉不启用
  # - DOMAIN-SUFFIX,stun.l.google.com,REJECT           #目标域名后缀规则匹配
  # - DOMAIN-KEYWORD,stun,REJECT
  # - DOMAIN-KEYWORD,turn,REJECT
  # - DOMAIN-KEYWORD,rtc,REJECT
  #
  # > 防止被追踪——屏蔽部分域名
  - DOMAIN,ping0.cc,REJECT                             # 屏蔽域名ping0.cc——该检测网站未经授权上传本地宽带IP信息并将其与本地宽带使用者关联
  # - GEOSITE,win-spy,REJECT                           # 屏蔽Win系统隐私跟踪域名
  # - GEOSITE,win-extra,REJECT                         # 屏蔽Win系统附加隐私跟踪域名
  #
  # > 广告域名拦截
  # - GEOSITE,category-ads-all,🛡️ 广告拦截             # 广告拦截，走策略组[🛡️ 广告拦截](效果有限，建议用浏览器插件)
  - GEOSITE,category-ads-all,REJECT-DROP               # 广告拦截，走REJECT-DROP,相当于策略组[🛡️ 广告拦截]的REJECT-DROP选项(效果有限，建议用浏览器插件)
  #
  # 去往目标IP段的去向流量走指定策略组或节点(走easytier节点)
  - IP-CIDR,10.10.10.0/24,🔵 ET2Miho,no-resolve           # 🔵 ET2Miho 是前面proxy中定义的easytier节点的代理名
  - IP-CIDR,10.147.20.0/24,🟠 ZT2Miho,no-resolve         # 🟠 ZT2Miho  是前面proxy中定义的zerotier节点的代理名
  - IP-CIDR,192.168.1.0/24,🕸 异地组网,no-resolve          # 凡是要去 网段192.168.1.0/24 的流量都走 et2miho (也就是走easytier)
  - IP-CIDR,192.168.2.0/24,🕸 异地组网,no-resolve
  - IP-CIDR,192.168.3.0/24,🕸 异地组网,no-resolve
  #
  # > 一机一IP的来源流量走指定策略中或节点
  # - SRC-IP-CIDR,192.168.2.236/32,📳 手机139-ip236    # 凡是来源IP为192.168.2.236的手机流量 走 策略组 [📳 手机139-ip236]
  # - SRC-IP-CIDR,192.168.2.231/32,🦞️ OpenCalw-ip231   # 来源IP规则匹配
  #
  # > 一网段一IP: 一WIFI一网段的来源流量走指定策略中或节点
  # - SRC-IP-CIDR,192.168.2.0/24,🖥 电脑Share           # 凡是来源IP为网段192.168.2.0/24的WIFI的设备(电脑)的流量都走 落地节点(组)[🖥 电脑Share]
  # - SRC-IP-CIDR,192.168.10.0/24,📳 手机Share         # 凡是来源IP为网段192.168.10.0/24的WIFI的设备(手机)的流量都走 落地节点(组)[📳 手机Share]
  #
  # > 本地Local/LAN IP/域名走直连(比如在本地访问路由器/NAS的IP/域名)
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  #
  # > google/microsoft/apple/steam在中国的专用域名 走DIRECT
  - GEOSITE,geolocation-!cn@cn,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,onedrive,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,icloud@cn,DIRECT
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  #
  # > 国外常用网站/流媒体域名走国外分流
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,google,🔍 Google
  - GEOSITE,github,👨🏿‍💻 GitHub

  - GEOSITE,microsoft,🪟 Microsoft
  - GEOSITE,apple,🍎 Apple
  - GEOSITE,category-ai-!cn,🤖 AIGC
  - GEOSITE,telegram,📲 Telegram
  - GEOSITE,twitter,𝕏 Twitter
  - GEOSITE,tiktok,🎵 TikTok
  - GEOSITE,facebook,🎭 Facebook
  - GEOSITE,reddit,🎀 Reddit
  - GEOSITE,netflix,🎥 NETFLIX
  - GEOSITE,paypal,💵 PayPal
  - GEOSITE,ea,🎮 Games
  - GEOSITE,steam,🎮 Games
  - GEOSITE,category-scholar-!cn,🚀 默认代理            # 国外学术相关网站走代理

  - RULE-SET,perproxy_domain,🚀 默认代理                # 自定义或自收集的域名 强制走 🚀 默认代理
  #
  # > 国外域名分流兜底 走代理
  - GEOSITE,gfw,🚀 默认代理
  # - GEOSITE,geolocation-!cn,🚀 默认代理               # GEOSITE,geolocation-!cn比gfw范围更大更广,但不推荐
  #
  # > 自搜集/自定义域名走DIRECT
  - RULE-SET,perdirect_domain,DIRECT                   # 自定义或自收集的 走直连(DIRECT)的域名
  #
# > 国内域名分流兜底 走DIRECT
  - GEOSITE,CN,DIRECT
  #
  # > 国内IP地址分流兜底 走DIRECT
  - GEOIP,CN,DIRECT
  # > 参数说明
  # >> 访问域名匹配到本规则时会同时通过nameserver和fallback两个DNS服务器同时并发发起DNS请求；
  # >> 若nameserver和fallback解析后的所有IP(一般是CDN的IP)与本规则cn_ip匹配，将会走direct-nameserver(国内DNS)二次DNS解析最优的真实IP——因为是国内的所以没有泄露,本地使用真实IP；
  # >> 若nameserver和fallback解析后的所有IP(一般是CDN的IP)中只要有国外的IP即表示与本规则的cn_ip不匹配，会继续往后匹配其他rules规则，
  #    直到最后匹配兜底Match规则🐟 漏网之鱼,此时会将所访问的域名而不是已经解析得到的IP发给兜底的漏网之鱼节点/组所在的远端网络环境中解析出真实IP进行访问——但本地使用fake-ip。
  #
  # > 兜底策略组
  - MATCH,🐟 漏网之鱼
# =============================== 分流规则 end ===============================
#
#
# =============================== 规则集Providers start ===============================
# >> type: 可选http/file/inline；  behavior: 可选domain/ipcidr/classical；  format: 可选yaml/mrs/text(包括list/ini等文本文件)
# >> 以下规则集url中的引用列表 优先采用.mrs格式: 二进制格式文件更小，但不能直接查阅，其次推荐.list格式——可直接打开查阅
# >> GEOSITE/GEOIP官方链接: https://github.com/MetaCubeX/meta-rules-dat/tree/meta/geo & https://github.com/Loyalsoldier/v2ray-rules-dat
# -----------------------------------------------------------------------------------------------------------------
rule-providers:
  private_domain: {type: http, interval: 86400, behavior: domain, format: mrs, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  fakeipfilter_domain: {type: http, interval: 86400, behavior: domain, format: mrs, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"}
  perdirect_domain: {type: http, interval: 86400, behavior: classical, format: text, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/itututec/ittt456/refs/heads/main/perlist/perdirect_domain.list"}
  perproxy_domain: {type: http, interval: 86400, behavior: classical, format: text, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/itututec/ittt456/refs/heads/main/perlist/perproxy_domain.list"}
  cn!_domain: {type: http, interval: 86400, behavior: domain, format: mrs, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"}

  # fakeipfilter_cn: {type: http, interval: 86400, behavior: classical, format: text, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-cn.list"}
  fakeipfilter_!cn: {type: http, interval: 86400, behavior: classical, format: text, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-!cn.list"}
  cn_ip: {type: http, interval: 86400, behavior: ipcidr, format: mrs, url: "https://proxy.tututec.eu.org/raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"}
#
## =============================== 全部 End =============================== ###
