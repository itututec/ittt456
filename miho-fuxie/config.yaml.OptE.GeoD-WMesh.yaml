#
#
# =============================== 策略组配置 start ===============================
proxy-groups:
# 通用策略组分类
  - {name: 🚀 默认代理, type: select, proxies: [👌 手选节点, 🎯 落地节点, ➕ 自建节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇸🇬 狮城节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🧩 其他节点, 🔯 自建故转, 🔯 香港故转, 🔯 台湾故转, 🔯 狮城故转, 🔯 日本故转, 🔯 美国故转, 🔁 香港自动, 🔁 台湾自动, 🔁 狮城自动, 🔁 日本自动,🔁 美国自动, DIRECT]}
  - {name: 👌 手选节点, type: select, include-all: true, exclude-filter: "(?i)2miho|直连"}       # 全部节点但不包含其他杂项节点
  - {name: 🕸 异地组网, type: select, proxies: [🔵 ET2Miho, 🟠 ZT2Miho, DIRECT]}       # 家里网络切换为DIRECT,家外切换为 🔵 ET2Miho / 🟠 ZT2Miho等异地组网

