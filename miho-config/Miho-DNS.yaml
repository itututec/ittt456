# Mihomo
# 如果你的代理节点延迟很低，那么可以添加通过代理解析的国外DNS
# 其中的节点选择是策略组，是将通过指定的代理服务器解析DNS请求，改成你的配置里写的proxy-groups里的项目就行
# 注意，DNS 服务器不是越多越好，参考这里的设置酌情删改，一般配置两个国外的就足够了
dns:
  enable: true
  listen: 0.0.0.0:1053
  prefer-h3: true
  ipv6: true
  ipv6-timeout: 50
  use-system-hosts: true
  use-hosts: true
  default-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
  proxy-server-nameserver:
    - https://doh.apad.pro/dns-query#DIRECT
  nameserver-policy:
    "geosite:tld-cn,private,cn":
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    "geosite:tld-!cn,gfw,geolocation-!cn":
      - https://9.9.9.9/dns-query#DIRECT
      - https://doh.apad.pro/dns-query#DIRECT
      - http://dns.google/dns-query#节点选择
      - https://cloudflare-dns.com/dns-query#节点选择
  nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  fallback:
    - https://9.9.9.9/dns-query#DIRECT
    - https://doh.apad.pro/dns-query#DIRECT
    - http://dns.google/dns-query#节点选择
    - https://cloudflare-dns.com/dns-query#节点选择
