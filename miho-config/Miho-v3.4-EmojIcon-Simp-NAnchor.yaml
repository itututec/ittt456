# =============================== 订阅或节点配置 end ===============================
#
#
# =============================== 流量嗅探sniffer配置 start ===============================
# > 启用流量嗅探功能，用于监控和分析网络流量
# > 嗅探（fakeip下可以不用嗅探）
sniffer:
  enable: true                       # 嗅探开关
  sniff:                             # 嗅探协议对象：目前支持tls/http
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true     # 是否使用嗅探结果作为实际访问，默认为 true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:                       # 需要跳过嗅探的域名
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "+.baidu.com"
    - "+.bilibili.com"
  # force-domain:                    # 需要强制嗅探的域名，默认只对IP嗅探
  # # - '+'                          # 去掉注释后等于全局嗅探
  #   - 'google.com'
  # port-whitelist:                 # 端口白名单，只对名单内的端口进行域名嗅探
  #  - 80
  #  - 443
  #  - 8000-9000
# =============================== 流量嗅探sniffer配置 end ===============================
#
#
# =============================== TUN配置 start ===============================
# > 配置 TUN 模式，适用于透明代理和高效流量转发,裸核跑才用的上
tun:
  enable: true      # 是否启用 tun 模式来路由全局流量
  stack: mixed      # tun 模式堆栈,可用值system/gvisor/mixed/lwip,如无使用问题,建议使用 system 栈;MacOS 用户推荐 gvisor栈
  dns-hijack: ["any:53", "tcp://any:53"]      # dns劫持,一般设置为 any:53 即可, 即劫持所有 53 端口的 udp 流量
  #   device: nikki      # 使用Nikki时，混入全部不修改的情况，开启接口指定为nikki
  # > 使用仅内核自行修改下面三项为true——一般情况下不用修改
  #device: utun0      # 指定 tun 网卡名称,MacOS 设备只能使用 utun 开头的网卡名
  auto-route: false      # 自动设置全局路由,可以自动将全局流量路由进入 tun 网卡
  auto-redirect: false
  auto-detect-interface: false      # 自动选择流量出口接口,多出口网卡同时连接的设备建议手动指定出口网卡
  mtu: 1492 # 减少 MTU 问题，如网页无法打开、测速慢
  gso: true # 启用通用分段卸载（提升性能）
  gso-max-size: 65536
  udp-timeout: 300 # UDP 会话保持时间
# =============================== TUN配置 start ===============================
#
#
# =============================== 全局基础配置 start ===============================
port: 7890                  # HTTP 代理端口，默认 7890
socks-port: 7891            # SOCKS5 代理端口，默认 7891
redir-port: 7892            # 透明代理端口，用于 Linux 和 MacOS
mixed-port: 7893            # HTTP(S) 和 SOCKS 代理混合端口
allow-lan: true             # 是否允许局域网设备连接
bind-address: "*"           # 绑定所有 IP 地址，默认会绑定到 127.0.0.1（本地回环地址），而 * 表示允许从任何网络接口连接
ipv6: true                  # 内核是否接受ipv6的数据进来
mode: rule                  # 使用规则模式分流
log-level: warning          # 日志级别
tcp-concurrent: true        # 启用 TCP 并发连接，将会使用 dns 解析出的所有 IP 地址进行连接，使用第一个成功的连接
unified-delay: true         # 开启统一延迟时，会计算 RTT，以消除连接握手等带来的不同类型节点的延迟差
find-process-mode: strict   # 进程匹配模式，always-开启:强制匹配所有进程；strict-默认:由Clash判断是否开启；off-不匹配进程:路由器用不上，选off
# authentication:             # 通过HTTP/SOCKS5连接时的账号密码，可多个账号密码，每行一个
#   - name:password
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:                   # 缓存设置(文件位置./cache.db)
  store-selected: true     # 节点状态记忆（若不同配置有同代理名称,设置值共享）
  store-fake-ip: true      # fake-ip缓存
# =============================== 全局基础配置 end ===============================
#
#
# =============================== DNS 配置 start ===============================
# > DNS 解析配置，决定了域名解析方式和缓存策略
# > DNS各项设置官方说明 https://merlinkodo.github.io/Clash-Rev-Doc/config/dns/#nameserver-policy
# hosts:                           # host，支持通配符（非通配符域名优先级高于通配符域名）
#   '*.clash.dev': 127.0.0.1     # 例如foo.example.com>*.example.com>.example.com
#   '.dev': 127.0.0.1
#   'alpha.clash.dev': '::1'
#
dns:
  enable: true              # 启用 DNS 功能
  listen: 0.0.0.0:1053      # 开启 DNS 服务器监听
  prefer-h3: false          # 如果DNS服务器支持DoH3会优先使用h3，提升性能
  use-hosts: true           # 查找 hosts 并返回IP记录,默认 true
  cache-algorithm: arc      # 使用性能更优的 ARC 缓存算法
  ipv6: true                # IP6解析开关；如果为false，将返回ip6结果为空
#
# > 启用 Fake-IP 模式，这是强制劫持所有 DNS 请求的关键。
  enhanced-mode: fake-ip      # 模式切换 redir-host/fake-ip，设置增强模式为fake-ip模式，提高解析速度和连接性能
  fake-ip-range: 28.0.0.0/8      # fake-ip 池设置
  fake-ip-range6: fc00::/16
# > Fake-IP 过滤器：确保国内域名不被 Fake-IP 转换
  fake-ip-filter-mode: blacklist      # 默认blacklist，匹配成功不返回fake-ip；可改为whitelist，即只有匹配成功才返回fake-ip
  fake-ip-filter:      # 配置不使用fake-ip的域名列表(也就是使用redir-host模式返回真实ip，针对国内少数用fake-ip时打不开的网站)
    # - "*"            # 相当所有的转为redir-host模式,全部返回真实ip
    - rule-set:fakeipfilter_domain
    # - rule-set:private_domain
  respect-rules: true      # 如果为true，将会按照rules的规则匹配分流(走代理或直连)；如果为false(默认)则nameserver/fallback/nameserver-policy在未特别指定时会直连
#
  nameserver-policy:      # 设置指定域名使用的DNS服务器
    # +.internal.crop.com: 10.0.0.1
    # www.baidu.com: https://223.5.5.5/dns-query
    geosite:private,onedrive,microsoft@cn,apple@cn,steam@cn,google@cn,jetbrains@cn,category-games@cn,cn:
    - https://223.5.5.5/dns-query      # AliDNS
    - https://1.12.12.12/dns-query      # TencentDNS
    geosite:geolocation-!cn:
    - https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
    - https://202.181.240.44/dns-query🔗 DNS      # 香港和记环球电讯DNS
    rule-set:google_domain: https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
    rule-set:youtube_domain: https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
    rule-set:twitter_domain: https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
    rule-set:facebook_domain: https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
    rule-set:tiktok_domain: https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
    rule-set:ai_domain: https://8.8.8.8/dns-query#🔗 DNS      # GoogleDNS
#
  # default-nameserver:        # 用于解析nameserver/fallback 以及其他 DNS 服务器配置的DNS服务域名, 只能使用纯IP格式，可使用加密 DNS
  #   - https://223.5.5.5/dns-query      # AliDNS
  #   - https://1.12.12.12/dns-query      # TencentDNS
  nameserver:      # 默认的域名解析服务器，如不配置fallback/proxy-server-nameserver, 则所有域名都由这里的nameserver解析
    # - 211.137.64.163      # 运营商DNS
    # - 211.137.58.20      # 运营商DNS
    - https://dns.alidns.com/dns-query      # AliDNS
    - https://doh.pub/dns-query      # TencentDNS
    # > 推荐将`ecs`设置为当前宽带运营商分配的默认DNS的IP段，ECS是DNS协议的一个扩展，允许DNS服务器根据客户端所在的子网(IP 地址段)返回更精确的解析结果
    # - https://doh.opendns.com/dns-query#ecs=211.137.58.0/24      # OpenDNS#ecs运营商DNS
    # - https://dns.google/dns-query#ecs=211.137.64.0/24      # GoogleDNS#ecs运营商DNS
  proxy-server-nameserver:     # 代理节点域名解析服务器，仅用于解析代理节点的域名，如果不填则遵循nameserver-policy、nameserver和fallback的配置
    - https://223.5.5.5/dns-query      # AliDNS
    - https://8.8.8.8/dns-query#🔗 DNS       # GoogleDNS
# =============================== DNS 配置 end ===============================
#
#
