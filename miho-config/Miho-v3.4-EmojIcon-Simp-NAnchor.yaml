rules:
  ## =============================== 防 WebRTC 泄漏 ===============================
  # > 防 WebRTC 泄漏（拦截 STUN）——如设置后经常出现问题，可注释掉不启用
  # - DOMAIN-SUFFIX,stun.l.google.com,REJECT      # #目的域名后缀规则匹配
  # - DOMAIN-KEYWORD,stun,REJECT
  # - DOMAIN-KEYWORD,turn,REJECT
  # - DOMAIN-KEYWORD,rtc,REJECT
  #
  # > 本地Local域名(比如在本地访问路由器后台的域名)
  - RULE-SET,private_domain,DIRECT
  #
  # > 国外网站/流媒体在国内专用域名 强制走直连
  # >> google-cn的部分域名DIRECT
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,DIRECT
  - DOMAIN-SUFFIX,googleapis,DIRECT
  - DOMAIN,clientservices.googleapis.com,DIRECT      # 目的域名规则匹配
  - DOMAIN,update.googleapis.com,DIRECT
  # - DOMAIN,translate.googleapis.com,DIRECT        # 让谷歌翻译能使用
  - DOMAIN,fonts.googleapis.com,DIRECT

  # >> google/microsoft/apple/steam在中国的专用域名 走直连
  - RULE-SET,google_domain-cn,DIRECT
  - RULE-SET,microsoft_domain-cn,DIRECT
  - RULE-SET,apple_domain-cn,DIRECT
  - RULE-SET,icloud_domain-cn,DIRECT
  - RULE-SET,steam_domain-cn,DIRECT
  #
  # > 国外常用网站/流媒体域名分流
  - DOMAIN-KEYWORD,youtube,📹 YouTube              
  - DOMAIN-SUFFIX,google.com,🔍 Google         
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🔍 Google
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,onedrive_domain,💾 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,apple_domain,🍎 Apple
  - RULE-SET,ai_domain,🤖 AIGC
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,twitter_domain,𝕏 Twitter
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,facebook_domain,🎭 Facebook
  - RULE-SET,reddit_domain,🎀 Reddit  
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💵 PayPal  
  - RULE-SET,EA_domain,🎮 Games
  - RULE-SET,steam_domain,🎮 Games
  
