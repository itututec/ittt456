# =============================== 订阅或节点配置 star ===============================
# ──────────────── 机场订阅配置，多个机场复制多个修改url即可 ────────────────
proxy-providers:  
  69yun:    # 机场名称，需自定义修改；可以定义多个机场（复制这一段代码修改url即可配置多个机场）
