  - {"type":"hysteria2","name":"🇯🇵 JP_vitebits-hy2-pD","server":"141.147.156.175","port":29802,"password":"********-971b-4d9d-ac45-************","sni":"www.bing.com","skip-cert-verify":true,"tfo":false}
  - {"type":"tuic","name":"🇯🇵 JP_vitebits-tuic-pD","server":"141.147.156.175","port":50531,"password":"*********-971b-4d9d-ac45-************","uuid":"********-971b-4d9d-ac45-2f2bfba68f95","congestion-controller":"bbr","udp-relay-mode":"native","alpn":["h3"],"sni":"www.bing.com","skip-cert-verify":true,"allowInsecure":"1","version":5}
