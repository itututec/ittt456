  - RULE-SET,ads_domain,REJECT      # 广告拦截，效果有限，建议用浏览器插件
  #
  # > 自用域名走直连
  - RULE-SET,perdirect_domain,DIRECT      # 自定义或自收集的 走 直连(DIRECT)的域名
  #
  # > 国内域名分流兜底 走直连
  - RULE-SET,cn_domain,DIRECT      # 国内域名兜底直连
